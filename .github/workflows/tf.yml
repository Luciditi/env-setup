name: terraform-checks

env:
  ENVSETUP_REPO_SSH: ${{ github.event.inputs.repo || 'git@github.com:Luciditi/env-setup.git' }}
  ENVSETUP_CONFIG: ${{ github.event.inputs.config || 'default.config.yml' }}
  ENVSETUP_VERSION: ${{ github.event.inputs.version || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  tf-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Check TF Changes
        id: changed
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c  # ratchet:tj-actions/changed-files@v45
        with:
          files: |
            infra/terraform/**
    outputs:
      any_changed: ${{ steps.changed.outputs.any_changed }}

  tf-doc:
    runs-on: ubuntu-latest
    needs: tf-changes
    if: needs.tf-changes.outputs.any_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # ratchet:actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Render README.md
        uses: terraform-docs/gh-actions@e47bfa196e79fa50987ef391be236d9d97b0c786  # ratchet:terraform-docs/gh-actions@v1.2.0
        with:
          working-dir: infra/terraform
          output-file: README.md
          config-file: .terraform-docs.yml
          output-method: replace
          git-push: "true"

  tf-fmt:
    runs-on: ubuntu-latest
    needs: tf-changes
    if: needs.tf-changes.outputs.any_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # ratchet:actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Terraform Format
        uses: dflook/terraform-fmt@c6e82d524f3ef6f84ba00b8fec05940c4b60bbed  # ratchet:dflook/terraform-fmt@v1
        with:
          path: infra/terraform
      - name: Commit format changes
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5  # ratchet:EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: Format `*.tf` to canonical format via `tf fmt`.
          add: 'infra/terraform/*.tf'

  tf-plan:
    runs-on: ubuntu-latest
    needs: tf-changes
    if: needs.tf-changes.outputs.any_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # ratchet:actions/checkout@v4
      - name: Install Terraform CLI
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # ratchet:hashicorp/setup-terraform@v3
      - name: Initialize Terraform
        run: terraform init
        working-directory: ./infra/terraform
      - name: Terraform Plan
        if: false
        run: terraform plan
        working-directory: ./infra/terraform

  tf-sec:
    runs-on: ubuntu-latest
    needs: tf-changes
    if: needs.tf-changes.outputs.any_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # ratchet:actions/checkout@v4
      - name: Terraform Sec Scan
        uses: aquasecurity/tfsec-pr-commenter-action@7a44c5dcde5dfab737363e391800629e27b6376b  # ratchet:aquasecurity/tfsec-pr-commenter-action@v1.3.1
        with:
          working_directory: 'infra/terraform'
          github_token: ${{ github.token }}
          soft_fail_commenter: true

  tf-validate:
    runs-on: ubuntu-latest
    needs: tf-changes
    if: needs.tf-changes.outputs.any_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # ratchet:actions/checkout@v4
      - name: Terraform Validate
        uses: dflook/terraform-validate@cfdea12135be7eb8960fbb272fb2f99c63a872f1  # ratchet:dflook/terraform-validate@v1
        id: validate
        with:
          path: infra/terraform
      - name: Validation Failed
        if: ${{ failure() && steps.validate.outputs.failure-reason == 'validate-failed' }}
        run: echo "terraform validate failed"
